server:
  # Lavalink stays private behind the panel proxy.
  address: 127.0.0.1
  port: 2333

# Read by the Java launcher; Lavalink API paths are proxied here.
panel:
  address: 0.0.0.0
  port: 80

lavalink:
  server:
    # Replace before packaging; this value is included in application.yml.
    password: "CHANGE-ME-TO-A-LONG-RANDOM-PASSWORD"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
    filters:
      channelMix: true
      equalizer: true
      karaoke: true
      lowPass: true
      rotation: true
      timescale: true
      tremolo: true
      vibrato: true
      volume: true
  # YouTube is loaded from the patched JAR under ./plugins by the ShardCloud package.
  plugins: []

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      enabled: true
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "King-Lavalink"

logging:
  file:
    name: logs/lavalink.log
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO


