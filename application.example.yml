server:
  # Local-only during development. Do not expose publicly without a security plan.
  address: 127.0.0.1
  port: 2333

lavalink:
  server:
    password: "${LAVALINK_SERVER_PASSWORD:change-me-before-running}"
    sources:
      # YouTube is provided by youtube-source plugin below, not the built-in source.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    trackStuckThresholdMs: 10000
    filters:
      channelMix: true
      equalizer: true
      karaoke: true
      lowPass: true
      rotation: true
      timescale: true
      tremolo: true
      vibrato: true
      volume: true
  plugins: []

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      # TV supports OAuth and can help when YouTube flags all unauthenticated clients.
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    oauth:
      enabled: true
      # Optional: set a refresh token after completing the OAuth flow once.
      # Keep credentials out of Git and use a dedicated burner account, not your primary account.
      # refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN}"
    # Instância pública mantida pelo projeto yt-cipher; para produção, prefira hospedar a sua.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "King-Lavalink"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
